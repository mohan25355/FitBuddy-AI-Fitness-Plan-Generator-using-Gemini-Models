<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or 'FitBuddy' }}</title>
  <meta name="description" content="FitBuddy generates personalized 7-day fitness plans with AI, nutrition guidance, and adaptive feedback.">
  <meta property="og:title" content="FitBuddy">
  <meta property="og:description" content="AI-powered personalized fitness planning with adaptive workout history and nutrition guidance.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0f0d">
  <link rel="icon" href="{{ request.url_for('static', path='icons/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/main.css') }}">
  <script defer src="{{ request.url_for('static', path='js/main.js') }}"></script>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="FitBuddy home">
        <span class="brand-mark">FB</span>
        <span class="brand-text">
          <strong>FitBuddy</strong>
          <span>AI Fitness Plan Generator</span>
        </span>
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav class="site-nav" id="site-nav" data-site-nav>
        <a href="/#how-it-works">How it works</a>
        <a href="/#features">Features</a>
        <a href="/onboarding">Build My Plan</a>
        <a href="/health">Health</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div>
        <strong>FitBuddy</strong>
        <p>General fitness guidance only. Not a substitute for professional medical advice.</p>
      </div>
      <div class="footer-links">
        <a href="/docs">API Docs</a>
        <a href="/admin/login">Admin</a>
        <a href="/health">Status</a>
      </div>
    </footer>
  </div>

  <div class="toast-region" aria-live="polite" aria-atomic="true" data-toast-region></div>
  <div class="loading-overlay" hidden data-loading-overlay>
    <div class="loading-card">
      <div class="spinner"></div>
      <div class="loading-copy" data-loading-copy>Analyzing your fitness profile...</div>
      <div class="loading-subcopy" data-loading-subcopy>Designing your 7-day routine...</div>
    </div>
  </div>
</body>
</html>
